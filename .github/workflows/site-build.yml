name: Site build

on:
  push:
    branches: [main]
    paths:
      - "satyaprobaho-website/**"
      - ".github/workflows/site-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "satyaprobaho-website/**"
      - ".github/workflows/site-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satyaprobaho-website
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build static site
        run: npm run build
